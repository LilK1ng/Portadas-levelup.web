<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEVELUP</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0d1017;--pn:#161b26;--ln:#2a3142;--tx:#dfe4ee;--mu:#8d97ab;--ps2:#4a6fd0;--ps3:#aeb6c4;--xb:#6aa84f;--wn:#d9a441;--bd:#c0594f;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Verdana,Tahoma,sans-serif}
h1,h2,h3{font-family:"Trebuchet MS",Verdana,sans-serif;margin:0;letter-spacing:.5px}
h2{font-size:1.4rem;padding:0 0 8px;border-bottom:2px solid var(--ln);margin-bottom:16px}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0a0d13;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:8px 14px}
.brand{font:700 1.4rem "Trebuchet MS",sans-serif;text-decoration:none;display:flex;align-items:center}
.brand img{height:38px;max-width:100%}
nav{margin-left:auto;display:flex;gap:2px}
nav a{padding:10px 9px;text-decoration:none;font-size:.85rem;color:var(--mu);border-radius:4px}
nav a:hover{color:var(--tx);background:var(--pn)}
.btn{display:inline-block;border:1px solid var(--ln);background:var(--pn);color:var(--tx);padding:11px 16px;min-height:44px;font:inherit;font-size:.9rem;border-radius:4px;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover:not(:disabled){border-color:var(--ps2)}
.btn.pri{background:var(--ps2);border-color:var(--ps2);color:#fff}
.btn.wa{background:#2f7d4f;border-color:#2f7d4f;color:#fff;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ps3);outline-offset:2px}
#menuBtn{display:none}
main section{max-width:1100px;margin:0 auto;padding:36px 16px}
.hero{text-align:center;padding-top:44px}
.hero h1{font-size:2.6rem;letter-spacing:6px}
.hero .logo{max-height:110px;max-width:80%}
.hero p{color:var(--mu);max-width:560px;margin:10px auto}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:26px auto 0}
.tile{background:var(--pn);border:1px solid var(--ln);border-bottom:4px solid var(--c);padding:18px 6px;cursor:pointer;font:700 1rem "Trebuchet MS",sans-serif;color:var(--tx);border-radius:4px}
.tile:hover{background:#1c2331}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.cov{aspect-ratio:3/4;background:linear-gradient(160deg,var(--c),#10131b);display:flex;align-items:flex-end;padding:8px;font:700 .85rem "Trebuchet MS",sans-serif;position:relative;background-size:cover;background-position:center}
.cov.wide{aspect-ratio:4/3}
.cov small{position:absolute;top:6px;right:6px;background:#0008;padding:1px 6px;border-radius:3px;font-weight:400}
.cb{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb b{font-size:.92rem;line-height:1.25}
.mu{color:var(--mu);font-size:.8rem}
.pr{font:700 1.05rem "Trebuchet MS",sans-serif;margin-top:auto;padding-top:6px}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:3px;border:1px solid var(--ln);color:var(--mu);width:max-content}
.tag.proximamente{border-color:var(--wn);color:var(--wn)}.tag.agotado{border-color:var(--bd);color:var(--bd)}.tag.disponible{border-color:var(--xb);color:var(--xb)}
.card .btn{margin:0 10px 10px;padding:9px}
.opts{display:none;flex-direction:column;gap:6px;margin:0 10px 10px}.opts.open{display:flex}.card .opts .btn{margin:0}
.card.sel{border-color:var(--xb)}
.bar{background:#0a0d13;border:1px solid var(--ln);padding:14px;border-radius:4px;margin:14px 0;position:sticky;top:60px;z-index:5}
.track{position:relative;height:18px;background:#1d2332;border:1px solid var(--ln);border-radius:2px;overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(90deg,var(--ps2) 0 10px,#3a58a8 10px 12px);width:0;transition:width .25s}
.rsv{position:absolute;left:0;top:0;height:100%;width:0;background:repeating-linear-gradient(45deg,#2a3246 0 5px,#3d4866 5px 10px);border-right:1px solid #55617f}
.fill.full{background:repeating-linear-gradient(90deg,var(--wn) 0 10px,#a67e30 10px 12px)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:11px;font:inherit;font-size:.9rem;min-height:44px}
.ctl input{flex:1;min-width:150px}
.msg{min-height:1.4em;color:var(--wn);font-size:.88rem;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--ln);background:var(--pn);color:var(--mu);padding:8px 13px;border-radius:20px;cursor:pointer;font:inherit;font-size:.82rem;min-height:40px}
.chip.on{border-color:var(--ps2);color:var(--tx);background:#1c2640}
.todo{outline:1px dashed var(--wn);outline-offset:2px}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--ln);z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#cart.open{transform:none}
#cart .hd,#cart .ft{padding:12px 14px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
#cart .ft{border:0;border-top:1px solid var(--ln);flex-direction:column;align-items:stretch;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#cart .bd{overflow:auto;padding:12px 14px;flex:1}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:10px;margin-bottom:10px;font-size:.85rem}
.it ul{margin:6px 0;padding-left:0;list-style:none}
.it .r{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.it .r .btn{padding:6px 12px;min-height:38px}
pre{background:#0a0d13;border:1px solid var(--ln);padding:10px;font-size:.75rem;white-space:pre-wrap;max-height:130px;overflow:auto;margin:0}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:40}
#ov.on{display:block}
footer{border-top:1px solid var(--ln);background:#0a0d13;padding:28px 16px;text-align:center;color:var(--mu);font-size:.88rem}
footer .row{margin:10px 0}
@media(max-width:820px){#menuBtn{display:block;margin-left:auto}nav{display:none;position:absolute;top:100%;left:0;right:0;background:#0a0d13;flex-direction:column;border-bottom:1px solid var(--ln);padding:6px 10px}nav.open{display:flex}nav a{padding:14px 8px;font-size:1rem}.hero h1{font-size:2rem}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#inicio" id="hLogo"></a>
  <nav id="nav">
    <a href="#inicio">Inicio</a><a href="#juegos" data-p="PS2">PS2</a><a href="#juegos" data-p="PS3">PS3</a><a href="#juegos" data-p="Xbox 360">Xbox 360</a><a href="#productos">Productos</a><a href="#servicios">Servicios</a><a href="#proximamente">Próximamente</a><a href="#contacto">Contacto</a>
  </nav>
  <button class="btn" id="cartBtn" aria-label="Abrir carrito">🛒 <span id="cnt">0</span></button>
  <button class="btn" id="menuBtn" aria-label="Menú">☰</button>
</header>

<main>
<section id="inicio" class="hero">
  <div id="heroLogo"></div>
  <p id="slogan" style="font-size:1.1rem;color:var(--tx)"></p>
  <p id="desc"></p>
  <div class="row">
    <a class="btn pri" href="#productos">Ver productos</a>
    <a class="btn" href="#juegos">Ver juegos</a>
    <a class="btn" id="waHero" target="_blank" rel="noopener">Contactar por WhatsApp</a>
  </div>
  <div class="tiles">
    <button class="tile" style="--c:var(--ps2)" data-p="PS2">PS2</button>
    <button class="tile" style="--c:var(--ps3)" data-p="PS3">PS3</button>
    <button class="tile" style="--c:var(--xb)" data-p="Xbox 360">Xbox 360</button>
  </div>
</section>

<section id="juegos">
  <h2 id="bTitle">Armá tu pendrive o disco</h2>
  <div class="mu" id="bNote" style="display:none;margin:0 0 8px"></div>
  <div class="chips" id="tipoRow" style="display:none"></div>
  <div class="ctl">
    <select id="dev" aria-label="Dispositivo"></select>
  </div>
  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div><div class="rsv" id="rsv"></div></div>
    <div id="spaceTxt" class="mu" style="margin-top:6px"></div>
    <div id="rsvTxt" class="mu" style="margin-top:2px"></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="row" style="justify-content:space-between;margin:8px 0 0">
      <b id="subTxt"></b>
      <span><button class="btn" id="clr">Vaciar</button> <button class="btn pri" id="addDev">Agregar al carrito</button></span>
    </div>
  </div>
  <div class="ctl"><input id="q" type="search" placeholder="🔎 Buscar juego..."><select id="fSort"><option value="n">Nombre</option><option value="s">Tamaño ↑</option><option value="sd">Tamaño ↓</option></select></div>
  <div class="chips" id="gChips"></div>
  <div class="grid" id="gGrid"></div>
</section>

<section id="productos">
  <h2>Productos</h2>
  <div class="chips" id="pChips"></div>
  <div class="grid" id="pGrid"></div>
</section>

<section id="servicios">
  <h2>Servicios</h2>
  <div class="grid" id="sGrid"></div>
</section>

<section id="proximamente">
  <h2>Próximamente</h2>
  <div class="grid" id="prGrid"></div>
</section>
</main>

<footer id="contacto">
  <div id="fLogo"></div>
  <div id="fSlogan"></div>
  <div class="row" id="fLinks"></div>
  <div id="fLoc"></div>
  <div class="mu" style="margin-top:10px">Precios en pesos argentinos (ARS)</div>
</footer>

<div id="ov"></div>
<aside id="cart" aria-label="Carrito">
  <div class="hd"><h3>Tu pedido</h3><button class="btn" id="closeCart">Cerrar</button></div>
  <div class="bd" id="cartBd"></div>
  <div class="ft">
    <b id="tot"></b>
    <input id="cname" placeholder="Tu nombre">
    <pre id="prev"></pre>
    <button class="btn wa" id="sendWa">Enviar pedido por WhatsApp</button>
    <button class="btn" id="emptyCart">Vaciar carrito</button>
  </div>
</aside>

<script>
/* =====================================================================
   DATOS DE LEVELUP  —  TODO LO QUE CAMBIES VA ACÁ ARRIBA
   Los campos marcados [RELLENAR] son los que tenés que completar.
   ===================================================================== */

const NEGOCIO = {
  nombre: "LEVELUP",
  logo: "",                       // [RELLENAR] ruta de tu logo, ej: "logo.png" (si queda vacío se muestra el nombre en texto)
  slogan: "[RELLENAR] slogan",
  descripcion: "[RELLENAR] descripción corta del negocio",
  ubicacion: "[RELLENAR] ubicación",
  whatsapp: "[RELLENAR]",         // solo números con código de país, ej: 5491123456789
  instagram: "[RELLENAR]",        // link completo, ej: https://instagram.com/tuusuario
  marketplace: "[RELLENAR]"       // link completo de tu perfil de Facebook Marketplace
};

/* DISPOSITIVOS
   capacidadComercial: lo que dice la caja. capacidadJuegosGB: lo que realmente queda para juegos (editable). capacidadTotalGB (opcional): lo que se muestra al cliente; la diferencia se ve como espacio ya ocupado.
   juegosGratis: cuántos juegos van incluidos en el precio (0 = todos se cobran). Poné "todos" para que ningún juego se cobre.
   estado: "disponible" | "proximamente" | "agotado" */
const DISPOSITIVOS = [
  { id:"pen64",  tipo:"Pendrives", nombre:"Pendrive 64 GB",  capacidadComercial:"64 GB", capacidadTotalGB:64, capacidadJuegosGB:52, precio:20000, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"pen128", tipo:"Pendrives", nombre:"Pendrive 128 GB", capacidadComercial:"128 GB", capacidadTotalGB:128, capacidadJuegosGB:110, precio:0 /* [RELLENAR] */, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"pen32",  tipo:"Pendrives", soloInstala:true, nombre:"Pendrive 32 GB", capacidadComercial:"32 GB", capacidadTotalGB:32, capacidadJuegosGB:26, precio:0, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"hdd160", tipo:"Discos rígidos", nombre:"Disco rígido 160 GB", capacidadComercial:"160 GB", capacidadTotalGB:160, capacidadJuegosGB:140, precio:0 /* [RELLENAR] */, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"hdd250", tipo:"Discos rígidos", soloInstala:true, nombre:"Disco rígido 250 GB", capacidadComercial:"250 GB", capacidadTotalGB:250, capacidadJuegosGB:225, precio:0, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"hdd360", tipo:"Discos rígidos", nombre:"Disco rígido 360 GB", capacidadComercial:"360 GB", capacidadTotalGB:360, capacidadJuegosGB:330, precio:0 /* [RELLENAR] */, juegosGratis:0, imagen:"", estado:"disponible" },
  { id:"hdd500", tipo:"Discos rígidos", nombre:"Disco rígido 500 GB", capacidadComercial:"500 GB", capacidadTotalGB:500, capacidadJuegosGB:460, precio:0 /* [RELLENAR] */, juegosGratis:0, imagen:"", estado:"disponible" }
];

/* JUEGOS (los de abajo son EJEMPLOS: reemplazalos por los tuyos)
   portada: ruta de una imagen propia o con licencia. Si queda vacía se muestra una tapa genérica. */
let JUEGOS = []; /* los juegos se cargan desde juegoslevelup.json */

/* PRODUCTOS (categoría: PS2, PS3, Xbox 360, Accesorios, Otros)
   estado: "disponible" se puede comprar | "agotado" se ve pero no se compra | "proximamente" aparece en la sección Próximamente */
const IMG_OPL = "imagenes/opl.webp";

const IMG_X360 = "imagenes/x360.webp";
const IMG_HEN = "imagenes/hen.webp";
const IMG_PENDRIVE = "imagenes/pendrive.webp";

const PRODUCTOS = [
  { id:"mem-opl", nombre:"Memoria PS2 con OPL instalado", categoria:"PS2", plataforma:"PS2", precio:0 /* [RELLENAR] */, imagen:IMG_OPL, descripcion:"Memory card nueva con OPL listo para usar.", estado:"disponible" },
  { id:"disco-ps2", nombre:"Disco rígido con juegos PS2", categoria:"PS2", plataforma:"PS2", precio:0 /* [RELLENAR] */, imagen:"", descripcion:"Disco rígido cargado con juegos.", estado:"agotado" },
  { id:"consola-ps2", nombre:"Consola PS2", categoria:"PS2", plataforma:"PS2", precio:0, imagen:"", descripcion:"Consolas PS2 listas para jugar.", estado:"proximamente" },
  { id:"consola-ps3", nombre:"Consola PS3", categoria:"PS3", plataforma:"PS3", precio:0, imagen:"", descripcion:"Consolas PS3 revisadas.", estado:"proximamente" },
  { id:"consola-x360", nombre:"Consola Xbox 360", categoria:"Xbox 360", plataforma:"Xbox 360", precio:0, imagen:"", descripcion:"Consolas Xbox 360.", estado:"proximamente" },
  { id:"joy", nombre:"Joysticks", categoria:"Accesorios", plataforma:"Varias", precio:0, imagen:"", descripcion:"Joysticks para PS2, PS3 y Xbox 360.", estado:"proximamente" },
  { id:"hdmi", nombre:"Cables HDMI y AV", categoria:"Accesorios", plataforma:"Varias", precio:0, imagen:"", descripcion:"Cables y adaptadores de video.", estado:"proximamente" },
  { id:"fuentes", nombre:"Fuentes y adaptadores", categoria:"Accesorios", plataforma:"Varias", precio:0, imagen:"", descripcion:"Fuentes de alimentación y adaptadores.", estado:"proximamente" }
];

/* SERVICIOS  —  activo:false lo oculta */
const SERVICIOS = [
  { id:"opl", nombre:"Instalar OPL en tu memory", imagen:IMG_OPL, descripcion:"Traé tu memory card y te la dejamos con OPL instalado, lista para correr tus juegos de PS2 desde pendrive o disco.", precio:0 /* [RELLENAR] */, activo:true },
  { id:"fmcb", nombre:"Memory con OPL", imagen:IMG_OPL, descripcion:"Memory card con OPL instalado, lista para jugar. Elegí si la querés nueva o usada.", precio:0, activo:true,
    opciones:[ { id:"nueva", nombre:"Memory nueva con OPL", precio:0 /* [RELLENAR] */ }, { id:"usada", nombre:"Memory usada con OPL", precio:0 /* [RELLENAR] */ } ] },
  { id:"pendrive", nombre:"Juega por pendrive", imagen:IMG_PENDRIVE, descripcion:"Jugá tus juegos de PS2 directo desde un pendrive. Elegí si querés un pendrive nuevo con juegos o que instalemos los juegos en el tuyo.", precio:0, activo:true,
    opciones:[ { id:"nuevo", nombre:"Pendrive nuevo con juegos", va:"nuevo", precio:0 /* [RELLENAR] */ }, { id:"instala", nombre:"Instala juegos en tu pendrive", va:"instala", precio:0 /* [RELLENAR] */ } ] },
  { id:"hen", nombre:"Instalar HEN en tu PS3", imagen:IMG_HEN, descripcion:"Dejamos tu PS3 con HEN para que puedas correr juegos y aplicaciones.", precio:0 /* [RELLENAR] */, activo:true },
  { id:"x360", nombre:"Liberar Xbox 360", imagen:IMG_X360, descripcion:"Liberamos tu Xbox 360 para que puedas jugar tus juegos desde disco o pendrive.", precio:0 /* [RELLENAR] */, activo:true }
];

/* =====================  FIN DE LOS DATOS  ===================== */

const totalGB = d => d.capacidadTotalGB || d.capacidadJuegosGB;
const reservGB = d => totalGB(d) - d.capacidadJuegosGB;
const PCOL = {"PS2":"#4a6fd0","PS3":"#8b94a6","Xbox 360":"#5f9a47"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ars = n => "$" + Math.round(n).toLocaleString("es-AR");
const gb = n => (Math.round(n * 100) / 100).toLocaleString("es-AR") + " GB";
const col = p => PCOL[p] || "#555d70";
const todo = s => String(s).includes("[RELLENAR]");
const ESTADO = {disponible:"Disponible", proximamente:"Próximamente", agotado:"Agotado"};

let cart = [], sel = {dev:null, games:[]}, editIdx = null, fPlat = "Todas", fCat = "Todas";
try { cart = JSON.parse(localStorage.getItem("levelup_cart") || "[]"); } catch(e) {}
const save = () => { try { localStorage.setItem("levelup_cart", JSON.stringify(cart)); } catch(e) {} };
const dev = id => DISPOSITIVOS.find(d => d.id === id);
const juego = n => JUEGOS.find(j => j.nombre === n);
const prod = id => PRODUCTOS.find(p => p.id === id);
const srv = id => SERVICIOS.find(s => s.id === id);
const srvOpt = (s, o) => s && s.opciones ? s.opciones.find(x => x.id === o) : null;
const srvName = it => { const s = srv(it.id); if(!s) return null; const o = srvOpt(s, it.opt); return o ? o.nombre : s.nombre; };

/* ---- cálculos ---- */
function usedGB(names){ return names.reduce((t,n)=> t + Math.round((juego(n)?.pesoGB||0)*100), 0) / 100; }
function gamesCost(d, names){
  if (d.juegosGratis === "todos") return 0;
  return names.slice(d.juegosGratis || 0).reduce((t,n)=> t + (juego(n)?.precio||0), 0);
}
function devTotal(d, names, modo){ return (modo==="instala" ? 0 : d.precio) + gamesCost(d, names); }
const devLabel = (it, d) => it.modo==="instala" ? `Instalar juegos en tu ${d.nombre}` : d.nombre;
function itemTotal(it){
  if (it.t === "dev"){ const d = dev(it.id); return d ? devTotal(d, it.games, it.modo) * it.q : 0; }
  if (it.t === "prod"){ const p = prod(it.id); return p ? p.precio * it.q : 0; }
  const s = srv(it.id); if(!s) return 0; const o = srvOpt(s, it.opt); return (o ? o.precio : s.precio) * it.q;
}
const total = () => cart.reduce((t,i)=> t + itemTotal(i), 0);

/* ---- encabezado / pie ---- */
function link(url){ return todo(url) ? "#" : url; }
function logoHTML(h){ return NEGOCIO.logo ? `<img src="${esc(NEGOCIO.logo)}" alt="${esc(NEGOCIO.nombre)}" style="height:${h}px;max-width:100%;width:auto">` : `<b style="letter-spacing:4px;font-size:${h>60?"2.6rem":"1.4rem"}">${esc(NEGOCIO.nombre)}</b>`; }
function initBusiness(){
  document.title = NEGOCIO.nombre;
  $("#hLogo").innerHTML = logoHTML(38);
  $("#heroLogo").innerHTML = logoHTML(110);
  $("#fLogo").innerHTML = logoHTML(48);
  [["#slogan","slogan"],["#desc","descripcion"],["#fSlogan","slogan"],["#fLoc","ubicacion"]].forEach(([s,k])=>{ const e=$(s); e.textContent = NEGOCIO[k]; if(todo(NEGOCIO[k])) e.classList.add("todo"); });
  const wa = waUrl("Hola LevelUp, quiero hacer una consulta.");
  $("#waHero").href = wa;
  $("#fLinks").innerHTML = [["Instagram", NEGOCIO.instagram],["Facebook Marketplace", NEGOCIO.marketplace],["WhatsApp", wa]]
    .map(([n,u])=>`<a class="btn" target="_blank" rel="noopener" href="${esc(link(u))}">${n}</a>`).join("");
}
const waNum = () => String(NEGOCIO.whatsapp).replace(/\D/g,"");
function waUrl(text){ return "https://wa.me/" + waNum() + "?text=" + encodeURIComponent(text); }

/* ---- configurador ---- */
let bMode = "todos", tipoSel = "Pendrives";
const devsModo = () => bMode==="nuevo" ? DISPOSITIVOS.filter(d=>d.tipo==="Pendrives" && !d.soloInstala)
  : bMode==="instala" ? DISPOSITIVOS.filter(d=>d.tipo===tipoSel).sort((a,b)=>totalGB(a)-totalGB(b))
  : DISPOSITIVOS.filter(d=>!d.soloInstala);
function renderTipoRow(){
  const r = $("#tipoRow"); r.style.display = bMode==="instala" ? "flex" : "none";
  r.innerHTML = [["Pendrives","Pendrive"],["Discos rígidos","Disco rígido"]].map(([t,n])=>`<button class="chip ${t===tipoSel?"on":""}" data-tipo="${t}">${n}</button>`).join("");
}
function setMode(m, quiet){
  bMode = m; tipoSel = "Pendrives"; sel = {dev:null, games:[]}; editIdx = null;
  $("#addDev").textContent = "Agregar al carrito"; say("");
  $("#bTitle").textContent = m==="todos" ? "Armá tu pendrive o disco" : "Armá tu pendrive";
  const n = $("#bNote"); n.style.display = m==="todos" ? "none" : "block";
  n.textContent = m==="nuevo" ? "Pendrive nuevo con tus juegos: elegí 64 GB o 128 GB y sumá los juegos." : "Traé tu pendrive o disco rígido y te instalamos los juegos. Elegí el tipo y la capacidad.";
  renderTipoRow(); renderDevSelect(); renderBar(); renderGames();
  if (!quiet) $("#juegos").scrollIntoView();
}
function renderDevSelect(){
  const opt = d => `<option value="${d.id}" ${d.estado!=="disponible"?"disabled":""}>${esc(d.nombre)} (${gb(totalGB(d))})${bMode==="instala"?"":" — "+(d.precio?ars(d.precio):"Consultar")}${d.estado!=="disponible"?" · "+ESTADO[d.estado]:""}</option>`;
  const l = devsModo();
  $("#dev").innerHTML = `<option value="">Elegí ${bMode==="instala"?"la capacidad":"un dispositivo"}...</option>` + (bMode==="todos" ? ["Pendrives","Discos rígidos"].map(t => `<optgroup label="${t}">${l.filter(d=>d.tipo===t).map(opt).join("")}</optgroup>`).join("") : l.map(opt).join(""));
  $("#dev").value = sel.dev || "";
}
function say(t){ $("#msg").textContent = t || ""; }
function renderBar(){
  const d = sel.dev && dev(sel.dev);
  if (!d){ $("#fill").style.width = "0"; $("#spaceTxt").textContent = "Elegí un dispositivo para empezar a sumar juegos."; $("#rsv").style.width = "0"; $("#rsvTxt").textContent = ""; $("#subTxt").textContent = ""; return; }
  const used = usedGB(sel.games) + reservGB(d), cap = totalGB(d), rest = Math.round((cap - used)*100)/100;
  const pct = cap ? Math.min(100, used / cap * 100) : 0;
  $("#fill").style.width = pct + "%"; $("#fill").classList.toggle("full", pct >= 90);
  $("#spaceTxt").textContent = `${gb(usedGB(sel.games))} en juegos · ${gb(rest)} disponibles · ${sel.games.length} juego(s)`;
  const rv = reservGB(d); $("#rsv").style.width = (cap ? rv / cap * 100 : 0) + "%";
  $("#rsvTxt").textContent = rv > 0 ? "▨ Espacio reservado para que funcione bien y sin errores" : "";
  $("#subTxt").textContent = "Subtotal: " + ars(devTotal(d, sel.games, bMode));
}
function toggleGame(n){
  const d = sel.dev && dev(sel.dev);
  if (!d){ say("Primero elegí un dispositivo."); $("#dev").focus(); return; }
  const i = sel.games.indexOf(n);
  if (i >= 0){ sel.games.splice(i,1); say(""); }
  else {
    const j = juego(n), rest = Math.round((d.capacidadJuegosGB - usedGB(sel.games))*100)/100;
    if (Math.round(j.pesoGB*100) > Math.round(rest*100)){ say(`❌ Este juego no entra en el espacio disponible. Necesita ${gb(j.pesoGB)} y quedan ${gb(rest)}.`); return; }
    sel.games.push(n); say("");
  }
  renderBar(); renderGames();
}
function renderGames(){
  const q = $("#q").value.trim().toLowerCase(), so = $("#fSort").value;
  let l = JUEGOS.filter(j => (fPlat==="Todas"||j.plataforma===fPlat) && j.nombre.toLowerCase().includes(q));
  l.sort((a,b)=> so==="s"?a.pesoGB-b.pesoGB : so==="sd"?b.pesoGB-a.pesoGB : a.nombre.localeCompare(b.nombre));
  $("#gChips").innerHTML = ["Todas","PS2","PS3","Xbox 360"].map(p=>`<button class="chip ${p===fPlat?"on":""}" data-gp="${p}">${p}</button>`).join("");
  $("#gGrid").innerHTML = l.map(j => {
    const on = sel.games.includes(j.nombre);
    const bg = j.portada ? `background-image:url('${esc(j.portada)}')` : "";
    return `<div class="card ${on?"sel":""}">
      <div class="cov" style="--c:${col(j.plataforma)};${bg}">${j.portada?"":esc(j.nombre)}<small>${esc(j.plataforma)}</small></div>
      <div class="cb">
        <b>${esc(j.nombre)}</b>
        <span class="mu">💾 ${gb(j.pesoGB)} · 📀 ${esc(j.formato||'ISO')}</span>
        <span class="mu">🗣️ ${esc(j.idioma||'Español')}</span>
        <span class="mu">🌍 Región: ${esc(j.region||'NTSC')}</span>
        ${j.genero ? `<span class="tag" style="margin-top:4px">${esc(j.genero)}</span>` : ""}
        ${j.descripcion ? `<p class="mu" style="margin:4px 0;font-size:0.75rem;line-height:1.2">${esc(j.descripcion)}</p>` : ""}
        <span class="pr">${ars(j.precio)}</span>
      </div>
      <button class="btn ${on?"":"pri"}" data-g="${esc(j.nombre)}">${on?"✓ Quitar":"Agregar"}</button>
    </div>`;
  }).join("") || `<p class="mu">No hay juegos con esa búsqueda.</p>`;
}

/* ---- productos / servicios / próximamente ---- */
function pCard(p){
  const cov = `<div class="cov wide" style="--c:${col(p.plataforma)};${p.imagen?`background-image:url('${esc(p.imagen)}')`:""}">${p.imagen?"":esc(p.nombre)}<small>${esc(p.plataforma)}</small></div>`;
  const ok = p.estado === "disponible";
  const btn = ok ? `<button class="btn pri" data-p="${p.id}">Agregar al carrito</button>` : `<button class="btn" disabled>${ESTADO[p.estado]}</button>`;
  return `<div class="card">${cov}<div class="cb"><b>${esc(p.nombre)}</b><span class="tag ${p.estado}">${ESTADO[p.estado]}</span><span class="mu">${esc(p.descripcion)}</span>${p.estado==="proximamente"?"":`<span class="pr ${p.precio?"":"todo"}">${p.precio?ars(p.precio):"Consultar"}</span>`}</div>${p.estado==="proximamente"?"":btn}</div>`;
}
function renderProducts(){
  const cats = ["Todas","PS2","PS3","Xbox 360","Accesorios","Otros"];
  $("#pChips").innerHTML = cats.map(c=>`<button class="chip ${c===fCat?"on":""}" data-pc="${c}">${c}</button>`).join("");
  const l = PRODUCTOS.filter(p => p.estado !== "proximamente" && (fCat==="Todas"||p.categoria===fCat));
  $("#pGrid").innerHTML = l.map(pCard).join("") || `<p class="mu">No hay productos en esta categoría por ahora.</p>`;
  $("#prGrid").innerHTML = PRODUCTOS.filter(p => p.estado==="proximamente").map(pCard).join("") || `<p class="mu">Pronto vamos a sumar novedades.</p>`;
  $("#sGrid").innerHTML = SERVICIOS.filter(s=>s.activo).map(s=>`<div class="card">${s.imagen?`<div class="cov wide" style="--c:var(--ps2);background-image:url('${s.imagen}')"></div>`:""}<div class="cb"><b>${esc(s.nombre)}</b><span class="mu ${todo(s.descripcion)?"todo":""}">${esc(s.descripcion)}</span><span class="pr ${s.precio?"":"todo"}">${s.precio?ars(s.precio):"Consultar"}</span></div>${s.opciones?`<button class="btn pri" data-st="${s.id}">Elegir opción</button><div class="opts" id="o-${s.id}">${s.opciones.map(o=>`<button class="btn" data-so="${s.id}|${o.id}">${esc(o.nombre)} · ${o.precio?ars(o.precio):"Consultar"}</button>`).join("")}</div>`:`<button class="btn pri" data-s="${s.id}">Agregar al carrito</button>`}</div>`).join("");
}

/* ---- carrito ---- */
function addCart(it){ cart.push(it); save(); renderCart(); openCart(); }
function addProd(id){ const p = prod(id); if(!p || p.estado!=="disponible") return;
  const x = cart.find(i=>i.t==="prod"&&i.id===id); x ? x.q++ : cart.push({t:"prod",id,q:1}); save(); renderCart(); openCart(); }
function addSrv(id,opt){ const s = srv(id); if(!s||!s.activo) return;
  const x = cart.find(i=>i.t==="srv"&&i.id===id&&i.opt===opt); x ? x.q++ : cart.push(opt?{t:"srv",id,opt,q:1}:{t:"srv",id,q:1}); save(); renderCart(); openCart(); }
function orderText(name){
  let t = "Hola LevelUp, quiero realizar este pedido:\n";
  cart.forEach(it => {
    if (it.t==="dev"){ const d=dev(it.id); if(!d) return; const u=usedGB(it.games)+reservGB(d);
      t += `\n${devLabel(it,d)}${it.q>1?" x"+it.q:""}\nJuegos:\n` + (it.games.map(n=>`- ${n} — ${gb(juego(n)?.pesoGB||0)}`).join("\n")||"- (sin juegos)") +
      `\nJuegos: ${gb(usedGB(it.games))} · Capacidad: ${gb(totalGB(d))}\nEspacio restante: ${gb(totalGB(d)-u)}\nSubtotal: ${ars(itemTotal(it))}\n`; }
    else { const o = it.t==="prod"?prod(it.id):srv(it.id); if(o) t += `\n${it.t==="srv"?srvName(it):o.nombre} x${it.q} — ${ars(itemTotal(it))}\n`; }
  });
  return t + `\nTotal: ${ars(total())}\n\nNombre: ${name || "[Nombre del cliente]"}`;
}
function renderCart(){
  $("#cnt").textContent = cart.reduce((t,i)=>t+i.q,0);
  $("#cartBd").innerHTML = cart.length ? cart.map((it,i)=>{
    let head = "", body = "";
    if (it.t==="dev"){ const d=dev(it.id); if(!d) return ""; const u=usedGB(it.games)+reservGB(d);
      head = `🕹️ ${esc(devLabel(it,d))}`;
      body = `<div class="mu">Capacidad: ${gb(totalGB(d))}</div><ul>${it.games.map(n=>`<li>✓ ${esc(n)} — ${gb(juego(n)?.pesoGB||0)}</li>`).join("")||"<li>Sin juegos</li>"}</ul><div class="mu">Espacio restante: ${gb(totalGB(d)-u)}</div>`; }
    else { const o = it.t==="prod"?prod(it.id):srv(it.id); if(!o) return ""; head = esc(it.t==="srv"?srvName(it):o.nombre); }
    return `<div class="it"><b>${head}</b>${body}<div class="r"><button class="btn" data-q="${i}" data-d="-1">−</button><b>${it.q}</b><button class="btn" data-q="${i}" data-d="1">+</button>${it.t==="dev"?`<button class="btn" data-e="${i}">Editar</button>`:""}<button class="btn" data-x="${i}">Quitar</button><b style="margin-left:auto">${ars(itemTotal(it))}</b></div></div>`;
  }).join("") : `<p class="mu">Tu carrito está vacío. Armá un pendrive o sumá un producto.</p>`;
  $("#tot").textContent = "TOTAL: " + ars(total());
  $("#prev").textContent = cart.length ? orderText($("#cname").value.trim()) : "";
  $("#prev").style.display = cart.length ? "block" : "none";
}
const openCart = () => { $("#cart").classList.add("open"); $("#ov").classList.add("on"); };
const closeCart = () => { $("#cart").classList.remove("open"); $("#ov").classList.remove("on"); };

/* ---- eventos ---- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-g],[data-gp],[data-pc],[data-p],[data-s],[data-so],[data-st],[data-tipo],a[href='#juegos'],[data-q],[data-x],[data-e],.tile,nav a");
  if (!b) return;
  const D = b.dataset;
  if ((b.getAttribute("href")==="#juegos" || b.classList.contains("tile")) && bMode!=="todos") setMode("todos", true);
  if (D.g) return toggleGame(D.g);
  if (D.gp){ fPlat = D.gp; return renderGames(); }
  if (D.pc){ fCat = D.pc; return renderProducts(); }
  if (D.st){ const el = document.getElementById("o-"+D.st); el.classList.toggle("open"); b.textContent = el.classList.contains("open") ? "Ocultar opciones" : "Elegir opción"; return; }
  if (D.tipo){ tipoSel = D.tipo; sel = {dev:null, games:[]}; say(""); renderTipoRow(); renderDevSelect(); renderBar(); renderGames(); return; }
  if (D.so){ const [sid,oid] = D.so.split("|"); const o = srvOpt(srv(sid),oid); if (o && o.va) return setMode(o.va); return addSrv(sid,oid); }
  if (D.s) return addSrv(D.s);
  if (D.q){ const it = cart[D.q]; it.q += +D.d; if (it.q < 1) cart.splice(D.q,1); save(); return renderCart(); }
  if (D.x){ cart.splice(D.x,1); if (editIdx!==null) editIdx=null; save(); return renderCart(); }
  if (D.e){ const it = cart[D.e], dd = dev(it.id); setMode(it.modo==="instala"?"instala":"todos", true); if (dd) tipoSel = dd.tipo; renderTipoRow(); renderDevSelect(); sel = {dev:it.id, games:[...it.games]}; editIdx = +D.e; $("#dev").value = it.id; closeCart(); renderBar(); renderGames(); $("#addDev").textContent = "Guardar cambios"; say("Editando tu pedido."); return $("#juegos").scrollIntoView(); }
  if (D.p && b.classList.contains("btn")) return addProd(D.p);
  if (D.p){ fPlat = D.p; renderGames(); if (b.classList.contains("tile")) $("#juegos").scrollIntoView(); }
  $("#nav").classList.remove("open");
});
$("#dev").onchange = e => { sel.dev = e.target.value || null; sel.games = []; say(""); renderBar(); renderGames(); };
$("#q").oninput = renderGames; $("#fSort").onchange = renderGames;
$("#clr").onclick = () => { sel.games = []; say(""); renderBar(); renderGames(); };
$("#addDev").onclick = () => {
  const d = sel.dev && dev(sel.dev);
  if (!d || d.estado !== "disponible"){ say("Elegí un dispositivo disponible."); return; }
  if (usedGB(sel.games) > d.capacidadJuegosGB){ say("❌ No hay suficiente espacio disponible."); return; }
  if (editIdx !== null && cart[editIdx]) { cart[editIdx].games = [...sel.games]; save(); renderCart(); openCart(); }
  else addCart(bMode==="instala" ? {t:"dev", id:d.id, games:[...sel.games], q:1, modo:"instala"} : {t:"dev", id:d.id, games:[...sel.games], q:1});
  editIdx = null; sel = {dev:null, games:[]}; $("#dev").value = ""; $("#addDev").textContent = "Agregar al carrito"; renderBar(); renderGames();
};
$("#cartBtn").onclick = openCart; $("#closeCart").onclick = closeCart; $("#ov").onclick = closeCart;
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
$("#emptyCart").onclick = () => { cart = []; save(); renderCart(); };
$("#cname").oninput = renderCart;
$("#sendWa").onclick = () => {
  if (!cart.length) return alert("Tu carrito está vacío.");
  const n = $("#cname").value.trim();
  if (!n){ $("#cname").focus(); return alert("Escribí tu nombre para enviar el pedido."); }
  if (waNum().length < 8) return alert("Falta configurar el número de WhatsApp en NEGOCIO.whatsapp.");
  window.open(waUrl(orderText(n)), "_blank");
};

function start(){ initBusiness(); renderDevSelect(); renderBar(); renderGames(); renderProducts(); renderCart(); }
fetch("juegoslevelup.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{ JUEGOS=j; start(); })
  .catch(()=>{ start(); $("#gGrid") && ($("#gGrid").innerHTML='<p class="mu">No se pudo cargar juegoslevelup.json. Abrí la página desde el hosting (o un servidor), no con doble clic al archivo.</p>'); });
</script>
</body>
</html>
